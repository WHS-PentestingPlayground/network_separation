version: '3.8'

services:
  db:
    image: container-registry.oracle.com/database/enterprise:latest
    container_name: oracle-db
    expose:
      - "1521"
    environment:
      - ORACLE_PWD=oracle123
      - ORACLE_CHARACTERSET=AL32UTF8
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend-net

  api:
    build: ./api
    container_name: api-server
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@db:1521:xe
      - SPRING_DATASOURCE_USERNAME=system
      - SPRING_DATASOURCE_PASSWORD=oracle123
    expose:
      - "8081"
    networks:
      - backend-net
      - frontend-net

  web:
    build:
      context: ./web
      dockerfile: ../docker/web/Dockerfile
    container_name: web-server
    volumes:
      - ./web/uploads:/usr/local/tomcat/webapps/uploads
    depends_on:
      - api
    ports:
      - "8080:8080"
    networks:
      - frontend-net

networks:
  frontend-net:
    driver: bridge

  backend-net:
    driver: bridge
    internal: true
